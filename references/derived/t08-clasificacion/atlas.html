<script>
const data=JSON.parse(document.getElementById('atlas-data').textContent);
const family=document.getElementById('family');
const base=document.getElementById('base');
const background=document.getElementById('background');
const locators=document.getElementById('locators');
const records=document.getElementById('records');
const ns='http://www.w3.org/2000/svg';
let selected=null;
for(const item of data.families){const option=document.createElement('option');option.value=item.id;option.textContent=item.label;family.append(option);}
function changeBase(){
 const native=base.value==='native', t=data.transform;
 background.setAttribute('href',native?data.native:data.composite);
 background.setAttribute('x',native?t.offset_x:0);background.setAttribute('y',native?t.offset_y:0);
 background.setAttribute('width',native?1536*t.scale_x:1851);background.setAttribute('height',native?813*t.scale_y:933);
 background.setAttribute('preserveAspectRatio','none');
}
function select(item){
 selected=item.id;
 for(const element of locators.children)element.classList.toggle('selected',element.dataset.id===selected);
 for(const element of records.querySelectorAll('button'))element.setAttribute('aria-pressed',String(element.dataset.id===selected));
 document.getElementById('detail-title').textContent=item.id+' · '+item.label;
 document.getElementById('detail-meta').textContent='Confianza '+item.confidence+' · Localización aproximada';
 document.getElementById('detail-criterion').textContent=item.criterion;
}
function draw(){
 locators.replaceChildren();records.replaceChildren();
 const list=data.items.filter(item=>item.family===family.value);
 document.getElementById('rule').textContent=data.families.find(item=>item.id===family.value).rule;
 document.getElementById('count').textContent=list.length+' grupos de trazos';
 for(const item of list){
  const t=data.transform,b=item.bbox_px,native=item.frame==='nativa';
  const x=native?b[0]*t.scale_x+t.offset_x:b[0],y=native?b[1]*t.scale_y+t.offset_y:b[1];
  const width=(b[2]-b[0])*(native?t.scale_x:1),height=(b[3]-b[1])*(native?t.scale_y:1);
  const rect=document.createElementNS(ns,'rect');rect.setAttribute('x',x);rect.setAttribute('y',y);rect.setAttribute('width',width);rect.setAttribute('height',height);rect.setAttribute('class','locator');rect.dataset.id=item.id;
  const title=document.createElementNS(ns,'title');title.textContent=item.id+' · '+item.label;rect.append(title);rect.addEventListener('click',()=>select(item));locators.append(rect);
  const row=document.createElement('li'),button=document.createElement('button'),id=document.createElement('strong');button.type='button';button.dataset.id=item.id;button.setAttribute('aria-pressed','false');id.textContent=item.id;button.append(id,document.createTextNode(item.label));button.addEventListener('click',()=>select(item));row.append(button);records.append(row);
 }
 select(list.find(item=>item.id===selected)??list[0]);
}
family.addEventListener('change',draw);base.addEventListener('change',changeBase);changeBase();draw();
</script>
